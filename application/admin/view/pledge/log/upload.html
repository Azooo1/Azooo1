<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
  <div class="form-group">
    <label for="c-file" class="control-label col-xs-12 col-sm-2">{:__('导入文件')}:</label>
    <div class="col-xs-12 col-sm-8">
      <div class="input-group">
        <input id="c-file" data-rule="" class="form-control" size="50" name="row[file]" type="text" value="" placeholder="请先下载卡牌导入模版 编辑后上传">
        <div class="input-group-addon no-border no-padding">
          <span><button type="button" id="plupload-file" class="btn btn-danger plupload" data-input-id="c-file" data-mimetype="*" data-multiple="false" data-preview-id="p-file"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
        </div>
      </div>
    </div>
  </div>
  <div class="form-group layer-footer">
    <label class="control-label col-xs-12 col-sm-2"></label>
    <div class="col-xs-12 col-sm-8">
      <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
    </div>
  </div>
</form>
