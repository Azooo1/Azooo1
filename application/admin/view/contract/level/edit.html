<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">级别名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">团队收益(%):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-rate" data-rule="required" min="0" class="form-control" step="0.01" name="row[rate]" type="number" value="{$row.rate|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">平级奖励(%):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-plat" data-rule="required" min="0" class="form-control" step="0.01" name="row[plat]" type="number" value="{$row.plat|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">手续费分红(%):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sxf" data-rule="required" min="0" class="form-control" step="0.01" name="row[sxf]" type="number" value="{$row.sxf|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">考核层级(代):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-line" data-rule="required" min="0" class="form-control" step="1" name="row[line]" type="number" value="{$row.line|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">团队累计业绩:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-pledge_num" data-rule="required" min="0" class="form-control" step="0.01" name="row[pledge_num]" type="number" value="{$row.pledge_num|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">级别要求:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[level]', $level, $row.level)}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">级别人数:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-level_num" data-rule="required" min="0" class="form-control" step="1" name="row[level_num]" type="number" value="{$row.level_num|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">直接购买费用（USDT，设置0表示禁止购买）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-price" data-rule="required" min="0" class="form-control" step="1" name="row[price]" type="number" value="{$row.price|htmlentities}">
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
