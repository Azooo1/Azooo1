<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Types')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-types" class="form-control" name="row[types]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Hash')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-hash" class="form-control" name="row[hash]" type="text">
            <button type="button" id="fill-hash-btn" class="btn btn-primary" style="margin-left:10px;">填写Hash</button>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Block')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-block" data-rule="required" class="form-control" name="row[block]" type="number" value="0">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Info')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-info" class="form-control " rows="5" name="row[info]" cols="50"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-status" data-rule="required" class="form-control" name="row[status]" type="number" value="1">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Address')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address" class="form-control" name="row[address]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Params1')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-params1" data-rule="required" class="form-control" step="0.000001" name="row[params1]" type="number" value="0.000000">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Params2')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-params2" data-rule="required" class="form-control" step="0.000001" name="row[params2]" type="number" value="0.000000">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var statusInput = document.getElementById('c-status');
        var fillBtn = document.getElementById('fill-hash-btn');
        function toggleBtn() {
            // Assuming status 1 = pending, 2 = success (based on model)
            if (parseInt(statusInput.value) === 2) {
                fillBtn.disabled = true;
                fillBtn.title = '支付成功，不能填写Hash';
            } else {
                fillBtn.disabled = false;
                fillBtn.title = '';
            }
        }
        // Initial check
        toggleBtn();
        statusInput.addEventListener('change', toggleBtn);
    });
</script>
