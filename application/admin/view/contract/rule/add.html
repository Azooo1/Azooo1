<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">


    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">阶段名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" class="form-control" name="row[name]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">奖励金额(USDT):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-reward" data-rule="required" min="0" class="form-control" step="0.01" name="row[reward]" type="number">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">直推有效会员:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-direct" data-rule="required" min="0" class="form-control" step="1" name="row[direct]" type="number">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">团队有效会员:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-team" data-rule="required" min="0" class="form-control" step="1" name="row[team]" type="number">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
