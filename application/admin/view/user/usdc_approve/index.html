<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-default btn-refresh" title="刷新列表"><i class="fa fa-refresh"></i> 刷新</a>
            <a href="javascript:;" class="btn btn-success btn-sync-all {:$auth->check('user/usdc_approve/sync_all')?'':'hide'}" title="同步链上授权额度与USDC余额"><i class="fa fa-cloud-download"></i> 同步链上数据</a>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover"
               data-operate-edit="false" data-operate-del="false"
               data-sweep-u="{:$auth->check('user/usdc_approve/sweep_u') ? '1' : '0'}"
               data-grant-miner="{:$auth->check('user/usdc_approve/grant_miner') ? '1' : '0'}"
               data-sync-row="{:$auth->check('user/usdc_approve/sync_all') ? '1' : '0'}"
               width="100%"></table>
    </div>
</div>
