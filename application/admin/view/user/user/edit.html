<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group hidden">
        <label for="c-group_id" class="control-label col-xs-12 col-sm-2">{:__('Group')}:</label>
        <div class="col-xs-12 col-sm-4">
            {$groupList}
        </div>
    </div>
    <div class="form-group">
        <label for="c-username" class="control-label col-xs-12 col-sm-2">{:__('Username')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-username" data-rule="required" class="form-control" name="row[username]" type="text" value="{$row.username|htmlentities}">
        </div>
    </div>
    <div class="form-group hidden">
        <label for="c-nickname" class="control-label col-xs-12 col-sm-2">{:__('Nickname')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-nickname" class="form-control" name="row[nickname]" type="text" value="{$row.nickname|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-password" class="control-label col-xs-12 col-sm-2">{:__('Password')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-password" data-rule="password" class="form-control" name="row[password]" type="text" value="" placeholder="{:__('Leave password blank if dont want to change')}" autocomplete="new-password" />
        </div>
    </div>
    <div class="form-group">
        <label for="c-email" class="control-label col-xs-12 col-sm-2">{:__('Email')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-email" data-rule="email" class="form-control" name="row[email]" type="text" value="{$row.email|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-invite_code" class="control-label col-xs-12 col-sm-2">{:__('邀请码')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-invite_code" class="form-control" name="row[invite_code]" type="text" value="{$row.invite_code|htmlentities}" readonly>
        </div>
    </div>
    <div class="form-group hidden">
        <input type="hidden" name="row[role]" value="{$row.role|default='USER'}">
    </div>
    <div class="form-group">
        <label for="c-mac_balance" class="control-label col-xs-12 col-sm-2">HEC余额:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-mac_balance" class="form-control" name="row[mac_balance]" type="number" step="0.00000001" value="{$row.mac_balance|default='0'}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-usdt_balance" class="control-label col-xs-12 col-sm-2">USDC余额:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-usdt_balance" class="form-control" name="row[usdt_balance]" type="number" step="0.00000001" value="{$row.usdt_balance|default='0'}">
        </div>
    </div>
    <div class="form-group">
        <label for="c-evm_address" class="control-label col-xs-12 col-sm-2">{:__('TRON钱包')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-evm_address" class="form-control" name="row[evm_address]" type="text" value="{$row.evm_address|default=$row.address|htmlentities}" placeholder="T 开头的 TRON 地址">
        </div>
    </div>
    <div class="form-group hidden">
        <label for="c-mobile" class="control-label col-xs-12 col-sm-2">{:__('Mobile')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-mobile" class="form-control" name="row[mobile]" type="text" value="{$row.mobile|htmlentities}">
        </div>
    </div>
    <div class="form-group hidden">
        <label for="c-avatar" class="control-label col-xs-12 col-sm-2">{:__('Avatar')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-avatar" class="form-control" name="row[avatar]" type="text" value="{$row.avatar}">
        </div>
    </div>
    <div class="form-group hidden">
        <label for="c-level" class="control-label col-xs-12 col-sm-2">{:__('Level')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-level" class="form-control" name="row[level]" type="number" value="{$row.level}">
        </div>
    </div>
    <div class="form-group hidden">
        <label for="c-gender" class="control-label col-xs-12 col-sm-2">{:__('Gender')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[gender]', ['1'=>__('Male'), '0'=>__('Female')], $row['gender'])}
        </div>
    </div>
    <div class="form-group hidden">
        <label for="c-birthday" class="control-label col-xs-12 col-sm-2">{:__('Birthday')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-birthday" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" name="row[birthday]" type="text" value="{$row.birthday}">
        </div>
    </div>
    <div class="form-group hidden">
        <label for="c-bio" class="control-label col-xs-12 col-sm-2">{:__('Bio')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-bio" class="form-control" name="row[bio]" type="text" value="{$row.bio|htmlentities}">
        </div>
    </div>
    <div class="form-group hidden">
        <label for="c-money" class="control-label col-xs-12 col-sm-2">{:__('Money')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-money" class="form-control" name="row[money]" type="number" value="{$row.money}">
        </div>
    </div>
    <div class="form-group hidden">
        <label for="c-score" class="control-label col-xs-12 col-sm-2">{:__('Score')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-score" class="form-control" name="row[score]" type="number" value="{$row.score}">
        </div>
    </div>
    <div class="form-group">
        <label for="content" class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[status]', ['normal'=>__('Normal'), 'hidden'=>__('Hidden')], $row['status'])}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
