  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06061a"/><stop offset="50%" stop-color="#0a0a22"/><stop offset="100%" stop-color="#061a0a"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e3a"/><stop offset="100%" stop-color="#0e0e1e"/>
    </linearGradient>
    <linearGradient id="fanG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#d77f71"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.2"/><stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
