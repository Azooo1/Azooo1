<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06061a"/><stop offset="50%" stop-color="#0a0a22"/><stop offset="100%" stop-color="#061a0a"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e3a"/><stop offset="100%" stop-color="#0e0e1e"/>
    </linearGradient>
    <linearGradient id="fanG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ccff"/><stop offset="100%" stop-color="#00e0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.2"/><stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="drop"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00ccff" flood-opacity="0.12"/></filter>
    <style>
      @keyframes f1 { to { transform: rotate(360deg); } }
      @keyframes f2 { to { transform: rotate(-360deg); } }
      @keyframes f3 { to { transform: rotate(360deg); } }
      @keyframes p1 { 0%,100% { opacity:0.2 } 50% { opacity:1 } }
      @keyframes p2 { 0%,100% { opacity:0.4 } 50% { opacity:0.9 } }
      @keyframes scan { to { transform: translateY(500%); } }
      @keyframes hb { 0% { width:10% } 30% { width:85% } 60% { width:30% } 100% { width:10% } }
      @keyframes pw { 0% { width:20% } 50% { width:95% } 100% { width:20% } }
      @keyframes df { to { stroke-dashoffset:-48 } }
      @keyframes pt { 0% { transform:translateY(0);opacity:0.6 } 100% { transform:translateY(-30px);opacity:0 } }
      .fL { animation: f1 2.5s linear infinite; transform-origin:130px 280px }
      .fR { animation: f2 3.2s linear infinite; transform-origin:369px 280px }
      .fB { animation: f3 4s linear infinite; transform-origin:250px 415px }
      .l1 { animation: p1 0.8s ease-in-out infinite }
      .l2 { animation: p2 1.5s ease-in-out infinite }
      .l3 { animation: p1 2s ease-in-out infinite }
      .sc { animation: scan 3.5s linear infinite }
      .hb { animation: hb 6s ease-in-out infinite }
      .pw { animation: pw 5s ease-in-out infinite }
      .df { animation: df 2s linear infinite; stroke-dasharray:4 8 }
      .pt { animation: pt 1.8s ease-out infinite }
    </style>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#bg)"/>
  <circle cx="250" cy="211" r="100" fill="url(#glow)"/>
  <rect x="62" y="93" width="375" height="237" rx="14" fill="url(#bodyG)" stroke="#3a3a5a" stroke-width="1.5" filter="url(#drop)"/>
