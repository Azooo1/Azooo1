      <rect x="316" y="162" width="68" height="62" rx="5" fill="#050510" stroke="#ff00aa" stroke-width="0.8"/>
      <rect x="324" y="170" width="52" height="46" rx="3" fill="#0d0d22" stroke="#ff00aa" stroke-width="0.4"/>
      <text x="350" y="197" fill="#ff00aa" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">GPU 4</text>
  <g stroke="#00ccff" stroke-width="0.8" opacity="0.35" class="df">
