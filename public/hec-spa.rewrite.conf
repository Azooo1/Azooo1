# HEC 前端 SPA 伪静态（宝塔：网站 → 设置 → 伪静态 → 粘贴本文件全部内容 → 保存）
# 作用：/dashboard、/miner-center 等前端路由刷新不再 404；/api 仍走 ThinkPHP
#
# 若有多站点（dy.suyan.life / dys.suyan.life），每个站点都要粘贴一次。
# 或通过 SSH：
#   cp /www/wwwroot/你的站点目录/public/hec-spa.rewrite.conf /www/server/panel/vhost/rewrite/你的域名.conf
#   nginx -t && nginx -s reload

# API → ThinkPHP
location ^~ /api/ {
    rewrite ^/(.*)$ /index.php?s=/$1 last;
}

# 前端 React 路由：无物理文件时回退 index.html
location / {
    try_files $uri $uri/ /index.html;
}
