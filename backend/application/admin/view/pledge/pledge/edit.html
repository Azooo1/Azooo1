<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">


    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">锁仓周期(天):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-day" data-rule="required" class="form-control" name="row[day]" type="text" value="{$row.day|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">每日收益(%):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-rate" data-rule="required" min="0" class="form-control" step="0.01" name="row[rate]" type="number" value="{$row.rate|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">提取手续费(%):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sxf" data-rule="required" min="0" class="form-control" step="0.01" name="row[sxf]" type="number" value="{$row.sxf|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">违约惩罚(%):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-wei" data-rule="required" min="0" class="form-control" step="0.01" name="row[wei]" type="number" value="{$row.wei|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">出局倍率:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-out" data-rule="required" min="0" class="form-control" step="0.01" name="row[out]" type="number" value="{$row.out|htmlentities}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
