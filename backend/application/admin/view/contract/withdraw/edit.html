<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

     <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">账户:</label>
        <div class="col-xs-12 col-sm-8">
            <text>
            {if $row.credittype == 1}
            USDT
            {/if}
            </text>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">钱包地址:</label>
        <div class="col-xs-12 col-sm-8">
            <text>
                {$row.address}
            </text>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Money')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-money" data-rule="required" class="form-control" step="0.000001" readonly="readonly" name="row[money]" type="number" value="{$row.money|htmlentities}">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            {if $row.status == 1}
            {:build_radios('row[status]', ['1'=>__('待审核'), '3'=>__('审核通过'),9=>"拒绝"], $row['status'])}
            {elseif $row.status == 2}
            待领取
            {elseif $row.status == 3}
            已打款
            {else}
            已拒绝
            {/if}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Remark')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-remark" class="form-control" name="row[remark]" type="text" value="{$row.remark|htmlentities}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
