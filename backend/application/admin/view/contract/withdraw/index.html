<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                        <div class="dropdown btn-group {:$auth->check('contract/withdraw/edit')?'':'hide'}">
                            <a class="btn btn-success btn-more dropdown-toggle btn-disabled disabled" data-toggle="dropdown"><i class="fa fa-check"></i> {:__('批量操作')}</a>
                            <ul class="dropdown-menu text-left" role="menu">
                                <li><a class="btn btn-link btn-batch-approve btn-disabled disabled" href="javascript:;" data-url="contract/withdraw/batch_approve"><i class="fa fa-check-circle"></i> {:__('批量通过')}</a></li>
                                <li><a class="btn btn-link btn-batch-reject btn-disabled disabled" href="javascript:;" data-url="contract/withdraw/batch_reject"><i class="fa fa-times-circle"></i> {:__('批量拒绝')}</a></li>
                            </ul>
                        </div>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('contract/withdraw/edit')}"
                           data-operate-del="{:$auth->check('contract/withdraw/del')}"
                           width="100%">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
