<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
            <div class="dropdown btn-group {:$auth->check('hec/c2c/edit')?'':'hide'}">
                <a class="btn btn-success btn-more dropdown-toggle btn-disabled disabled" data-toggle="dropdown"><i class="fa fa-check"></i> 批量操作</a>
                <ul class="dropdown-menu text-left" role="menu">
                    <li><a class="btn btn-link btn-batch-accept btn-disabled disabled" href="javascript:;" data-url="hec/c2c/batch_accept"><i class="fa fa-handshake-o"></i> 批量接单</a></li>
                    <li><a class="btn btn-link btn-batch-complete btn-disabled disabled" href="javascript:;" data-url="hec/c2c/batch_complete"><i class="fa fa-check-circle"></i> 批量完成</a></li>
                    <li><a class="btn btn-link btn-batch-cancel btn-disabled disabled" href="javascript:;" data-url="hec/c2c/batch_cancel"><i class="fa fa-times-circle"></i> 批量取消并退回</a></li>
                </ul>
            </div>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover"
               data-operate-edit="{:$auth->check('hec/c2c/edit')}" width="100%"></table>
    </div>
</div>
