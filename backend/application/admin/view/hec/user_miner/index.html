<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-body">
        <div id="toolbar" class="toolbar">
            <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
            <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('hec/user_miner/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> {:__('Delete')}</a>
            <div class="dropdown btn-group {:$auth->check('hec/user_miner/edit')?'':'hide'}">
                <a class="btn btn-success btn-more dropdown-toggle btn-disabled disabled" data-toggle="dropdown"><i class="fa fa-check"></i> 批量操作</a>
                <ul class="dropdown-menu text-left" role="menu">
                    <li><a class="btn btn-link btn-batch-approve btn-disabled disabled" href="javascript:;" data-url="hec/user_miner/batch_approve"><i class="fa fa-check-circle"></i> 批量通过</a></li>
                    <li><a class="btn btn-link btn-batch-reject btn-disabled disabled" href="javascript:;" data-url="hec/user_miner/batch_reject"><i class="fa fa-times-circle"></i> 批量拒绝</a></li>
                </ul>
            </div>
        </div>
        <table id="table" class="table table-striped table-bordered table-hover"
               data-operate-edit="{:$auth->check('hec/user_miner/edit')}"
               data-operate-del="{:$auth->check('hec/user_miner/del')}" width="100%"></table>
    </div>
</div>
